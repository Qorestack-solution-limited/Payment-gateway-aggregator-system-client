services:
  - type: web
    name: payorchestra-api
    runtime: node
    plan: free
    buildCommand: cd api_backend_nestjs && npm ci && npm run prisma:generate && npm run build
    startCommand: cd api_backend_nestjs && npm run start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: payorchestra-db
          property: connectionString
      - key: CLIENT_URL
        value: https://payorchestra-web.onrender.com
      - key: JWT_SECRET
        sync: false

  - type: web
    name: payorchestra-web
    runtime: static
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://payorchestra-api.onrender.com/api/v1

databases:
  - name: payorchestra-db
    databaseName: payorchestra
    user: payorchestra
    plan: free
    postgresMajorVersion: "15"
    ipAllowList: []
